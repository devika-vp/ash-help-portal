<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal received // Ash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=DM+Mono:wght@500&family=Outfit:wght@400;500;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
  <div class="site-background-overlay" aria-hidden="true"></div>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="noise"></div>

  <main class="footer-cta section-pad"
    style="min-height: 100vh; display: grid; place-items: center; align-content: center">
    <div class="glass-card" style="padding: 48px 36px; max-width: 580px; border-radius: 32px">
      <div class="footer-ornament" style="font-size: 48px; color: var(--gold)">✦</div>
      <p class="eyebrow" style="margin-top: 12px">Signal received</p>
      <h1 style="font-size: clamp(36px, 5vw, 64px); line-height: 1">Your story is<br /><em
          style="font-family: 'Cormorant Garamond', serif; font-style: italic; background: linear-gradient(90deg, #c4b5fd, #f5c76b); -webkit-background-clip: text; background-clip: text; color: transparent;">
          in safe hands.
        </em>
      </h1>
      <p style="color: var(--muted); font-size: 16px; margin: 20px 0 32px; line-height: 1.6">Ash and the team have
        logged your request. Remember that reaching out is a mark of courage.</p>
      <a class="button button-light" href="{{ url_for('home') }}">Return to Ash Portal <span>↗</span></a>
    </div>
  </main>
</body>

</html>
